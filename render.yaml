# Render Blueprint for YourDues.
#
#   web    = Next.js (React UI + /api route handlers: read Postgres, enqueue,
#            live you.com news search, OpenAI fund drafting)
#   worker = Python verification pipeline (consumes csr:jobs, applies migrations)
#   cron   = Python discovery enqueuer
#
# Secrets (you.com + OpenAI keys) live in the `csr-secrets` group with
# sync:false — set their values once in the Render dashboard, never in git.

services:
  - type: web
    name: yourdues-web
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    autoDeploy: true
    healthCheckPath: /api/healthz
    envVars:
      - fromGroup: csr-secrets          # web needs YOU_SEARCH + OPENAI for search / AI-fund
      - key: DATABASE_URL
        fromDatabase:
          name: causes-db
          property: connectionString
      - key: KV_URL
        fromService:
          type: keyvalue
          name: causes-kv
          property: connectionString

  - type: worker
    name: yourdues-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    autoDeploy: true
    dockerCommand: python -m app.worker
    preDeployCommand: python -m scripts.migrate   # idempotent; worker also migrates at startup
    envVars:
      - fromGroup: csr-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: causes-db
          property: connectionString
      - key: KV_URL
        fromService:
          type: keyvalue
          name: causes-kv
          property: connectionString

  - type: cron
    name: yourdues-discovery
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    schedule: "*/30 * * * *"
    autoDeploy: false
    dockerCommand: python -m app.cron
    envVars:
      - fromGroup: csr-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: causes-db
          property: connectionString
      - key: KV_URL
        fromService:
          type: keyvalue
          name: causes-kv
          property: connectionString

  - type: keyvalue
    name: causes-kv
    plan: free
    maxmemoryPolicy: noeviction

databases:
  - name: causes-db
    plan: free

envVarGroups:
  - name: csr-secrets
    envVars:
      # secrets — enter values in the Render dashboard (never committed)
      - key: YOU_SEARCH_API_KEY
        sync: false
      - key: YOU_RESEARCH_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # non-secret config (safe defaults, overridable)
      - key: CREW_MODEL
        value: openai/gpt-4o-mini
      - key: YOU_SEARCH_BASE_URL
        value: https://ydc-index.io
      - key: YOU_RESEARCH_BASE_URL
        value: https://api.you.com
      - key: YOU_RESEARCH_EFFORT
        value: standard
      - key: MAX_CANDIDATES_PER_RUN
        value: "6"
