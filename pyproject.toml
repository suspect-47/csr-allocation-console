[project]
name = "csr-allocation-console"
version = "0.1.0"
description = "CSR allocation console with agentic cause verification"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true   # crewai/litellm ship partial stubs

# CrewAI's Flow / decorators are untyped; this module wraps them intentionally.
# The logic it delegates to is fully typed and tested via run_pipeline_pure.
[[tool.mypy.overrides]]
module = "app.flow.pipeline"
disallow_untyped_decorators = false
warn_unused_ignores = false
disable_error_code = ["misc", "no-any-return"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
